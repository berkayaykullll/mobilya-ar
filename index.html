<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Sehpa AR Görünümü</title>
  <!-- Google Model Viewer Kütüphanesi (iOS ve Android Uyumlu) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    #ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007aff;
      color: white;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 30px;
      border: none;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.39);
      cursor: pointer;
      z-index: 999;
      -webkit-tap-highlight-color: transparent;
    }
    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
      background-color: #0062cc;
    }
  </style>
</head>
<body>

  <!-- 
    Görseldeki tam dosya isimleri tanımlandı: Sehpa.glb ve Sehpa.usdz
    Eğer objeniz ekranda/AR'da küçük görünürse scale="1000 1000 1000" satırını ekleyebilirsiniz.
  -->
  <model-viewer 
    src="Sehpa.glb" 
    ios-src="Sehpa.usdz" 
    alt="3D Sehpa Modeli"
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    camera-controls 
    auto-rotate
    shadow-intensity="1">

    <button slot="ar-button" id="ar-button">
      📱 Evinizde Görüntüleyin
    </button>

  </model-viewer>

</body>
</html>
