<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3B Model Görüntüleyici</title>
    <!-- Google model-viewer kütüphanesi -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 90%;
            max-width: 800px;
            height: 500px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 
          'src' alanına .glb veya .gltf dosyanızın yolunu yazın.
          'ios-src' alanına .usdz dosyanızın yolunu yazın.
        -->
        <model-viewer 
            src="model.glb" 
            ios-src="model.usdz" 
            alt="3D Model" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1" 
            ar 
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>
        
        <div class="controls-hint">Döndürmek için sürükleyin • Yakınlaştırmak için kaydırın</div>
    </div>

</body>
</html>
