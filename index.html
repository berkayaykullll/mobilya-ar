<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Mobilya Görünümü</title>
  <!-- Google Model Viewer Kütüphanesi -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    /* AR Butonu Tasarımı */
    #ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007aff;
      color: white;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 30px;
      border: none;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.39);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 999;
      -webkit-tap-highlight-color: transparent;
    }
    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
      background-color: #0062cc;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="mobilya.glb" 
    ios-src="mobilya.usdz" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    ar-scale="fixed"
    scale="1000m 1000m 1000m"
    camera-controls 
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1.5"
    shadow-softness="1"
    bounds="tight"
    exposure="1.2"
    interaction-prompt="auto">

    <!-- Odada/Kamerada Göster Butonu -->
    <button slot="ar-button" id="ar-button">
      📱 Evinizde Görüntüleyin
    </button>

  </model-viewer>

</body>
</html>
