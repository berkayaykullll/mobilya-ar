<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sehpa AR Görünümü</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f9;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
    }
    /* iOS Quick Look AR Butonu */
    .ar-link {
      display: inline-block;
      text-decoration: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.35);
      transition: all 0.2s ease;
    }
    .ar-link:active {
      transform: scale(0.96);
      background-color: #005ecb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>3D Sehpa Modeli</h1>
    <p>Sehpanın evinizde nasıl duracağını görmek için aşağıdaki butona dokunun.</p>
    
    <!-- GitHub depondaki tam dosya adı yapıldı: Sehpa.usdz -->
    <a rel="ar" href="Sehpa.usdz" class="ar-link">
      📱 Evinizde Görüntüleyin
    </a>
  </div>

</body>
</html>
